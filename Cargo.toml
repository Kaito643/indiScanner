[package]
name = "threat-harvester"
version = "0.2.0"
edition = "2021"
description = "Capability-routed Cyber Threat Intelligence aggregator (IOC enrichment + collection)."
license = "MIT"
readme = "README.md"

[lib]
name = "threat_harvester"
path = "src/lib.rs"

[[bin]]
name = "threatharvester"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
futures = "0.3"
toml = "0.8"
base64 = "0.22"
sha2 = "0.10"
# abuse.ch ships AES-encrypted, deflated sample ZIPs; enable just those two
# (both pure-Rust) and skip the C-backed codecs (zstd/lzma/bzip2) the defaults
# would pull in.
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto"] }

# Interactive terminal UI (`threatharvester tui`).
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Local web dashboard + REST API (`threatharvester serve`).
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v5"] }

[workspace]
# The archived first-gen engine lives under legacy/rust-v1 and is not part of the active build.
exclude = ["legacy"]
